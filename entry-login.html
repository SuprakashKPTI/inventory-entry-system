<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Page Login</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="supabase-config.js"></script>
    
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #0078d4;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .microsoft-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background-color: #00a4ef;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        .microsoft-btn:hover {
            background-color: #0084c7;
        }
        
        .microsoft-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .error-message {
            background-color: #fde7e9;
            color: #d13438;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #d13438;
            font-size: 14px;
            display: none;
        }
        
        .success-message {
            background-color: #dff6dd;
            color: #107c10;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #107c10;
            font-size: 14px;
            display: none;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading-spinner.active {
            display: block;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .admin-link a {
            color: #0078d4;
            text-decoration: none;
            font-size: 14px;
        }
        
        .admin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Inventory Entry Login</h1>
            <p>Sign in with your Microsoft account to access the entry page</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <div class="login-form">
            <button id="microsoft-login-btn" class="microsoft-btn" onclick="handleMicrosoftLogin()">
                <svg width="20" height="20" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft
            </button>
        </div>
        
        <div id="loading-spinner" class="loading-spinner">
            <p>Signing in...</p>
        </div>
        
        <div class="admin-link">
            <a href="admin/login.html">Admin Panel Login →</a>
        </div>
    </div>
    
    <script>
        // Check if already authenticated
        async function checkExistingSession() {
            try {
                const session = await getSession();
                if (session) {
                    const authTime = new Date(session.expires_at).getTime();
                    const currentTime = Date.now();
                    
                    // Session expires after 8 hours
                    if (currentTime < authTime) {
                        window.location.href = 'index.html';
                    } else {
                        await signOut();
                    }
                }
            } catch (error) {
                console.error('Error checking session:', error);
            }
        }
        
        // Handle Microsoft login
        async function handleMicrosoftLogin() {
            const loginBtn = document.getElementById('microsoft-login-btn');
            const loadingSpinner = document.getElementById('loading-spinner');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // Show loading state
            loginBtn.disabled = true;
            loadingSpinner.classList.add('active');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            try {
                // Sign in with Microsoft OAuth
                await signInWithMicrosoft();
                // Redirect will happen automatically via Supabase
            } catch (error) {
                console.error('Microsoft login error:', error);
                errorMessage.textContent = 'Error signing in with Microsoft. Please try again.';
                errorMessage.style.display = 'block';
                loginBtn.disabled = false;
                loadingSpinner.classList.remove('active');
            }
        }
        
        // Handle redirect after successful login
        async function handleRedirect() {
            const loadingSpinner = document.getElementById('loading-spinner');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            try {
                // Get session after redirect
                const session = await getSession();
                
                if (session) {
                    const user = session.user;
                    const userName = user.user_metadata?.full_name || user.email || user.user_metadata?.name || 'User';
                    
                    // Store authentication info
                    sessionStorage.setItem('userAuthenticated', 'true');
                    sessionStorage.setItem('userAuthTime', Date.now().toString());
                    sessionStorage.setItem('userName', userName);
                    sessionStorage.setItem('userEmail', user.email);
                    
                    successMessage.textContent = 'Login successful! Redirecting...';
                    successMessage.style.display = 'block';
                    
                    // Redirect to entry page
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    errorMessage.textContent = 'Login failed. Please try again.';
                    errorMessage.style.display = 'block';
                    loadingSpinner.classList.remove('active');
                }
            } catch (error) {
                console.error('Error handling redirect:', error);
                errorMessage.textContent = 'Error completing login. Please try again.';
                errorMessage.style.display = 'block';
                loadingSpinner.classList.remove('active');
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Check if this is a redirect from Microsoft OAuth
            const urlParams = new URLSearchParams(window.location.search);
            const hasCode = urlParams.has('code') || urlParams.has('access_token');
            
            if (hasCode) {
                // Handle the redirect
                handleRedirect();
            } else {
                // Check for existing session
                checkExistingSession();
            }
        });
    </script>
</body>
</html>
